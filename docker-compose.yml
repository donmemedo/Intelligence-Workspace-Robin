services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["8200:8000"]
    volumes: [robin-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    ports: ["3210:3000"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  robin-data:
